<!-- IMPACTEX STYLE ULTRALIGHT NAVBAR -->
<nav class="w-full bg-white fixed top-0 z-50 border-b border-gray-100 flex items-center justify-between px-6 xl:px-12 h-16 shadow-sm">
  
  <!-- LEFT: Links Corporativos -->
  <div class="hidden lg:flex items-center gap-6 text-[10px] font-black uppercase tracking-widest text-black">
    <a routerLink="/grupo" class="hover:text-gray-500 transition-colors cursor-pointer">Grupo</a>
    <a routerLink="/grupo" fragment="marcas" class="hover:text-gray-500 transition-colors cursor-pointer">Marcas</a>
    <a routerLink="/sostenibilidad" class="hover:text-gray-500 transition-colors cursor-pointer">Sostenibilidad</a>
    <a routerLink="/talento" class="hover:text-gray-500 transition-colors cursor-pointer">Talento</a>
  </div>

  <!-- Banderín Móvil (Oculto en desktop) -->
  <button (click)="abrirMenu()" class="lg:hidden flex items-center text-black focus:outline-none cursor-pointer p-1" aria-label="Abrir menú">
    <i class="fas fa-bars text-xl"></i>
  </button>

  <!-- CENTER: Text Logo Massive -->
  <div class="absolute left-1/2 -translate-x-1/2">
    <a routerLink="/" class="text-3xl font-black tracking-tighter text-black select-none pointer-events-auto" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
      IMPACTEX
    </a>
  </div>

  <!-- RIGHT: Extras -->
  <div class="flex items-center gap-6 text-[10px] font-black uppercase tracking-widest text-black">

    <a routerLink="/" fragment="contacto" class="hover:text-gray-500 transition-colors cursor-pointer hidden sm:block">Contacto</a>
    <a class="hover:text-gray-500 transition-colors cursor-pointer">EN / ES</a>
    <i class="fas fa-search text-xs cursor-pointer hover:text-gray-500 transition-colors"></i>
  </div>

</nav>

<!-- PANEL MENÚ MÓVIL (DRAWER EDITORIAL GLOBAL) -->
<div class="mobile-menu-overlay" *ngIf="menuAbierto" (click)="cerrarMenu()">
  <div class="mobile-menu-drawer" (click)="$event.stopPropagation()">
    <div class="mobile-menu-header">
      <span class="mobile-menu-logo">IMPACTEX</span>
      <button (click)="cerrarMenu()" class="mobile-menu-close" aria-label="Cerrar menú">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="mobile-menu-links">
      <a routerLink="/grupo" (click)="cerrarMenu()" class="mobile-menu-link">Grupo</a>
      <a routerLink="/grupo" fragment="marcas" (click)="cerrarMenu()" class="mobile-menu-link">Marcas</a>
      <a routerLink="/sostenibilidad" (click)="cerrarMenu()" class="mobile-menu-link">Sostenibilidad</a>
      <a routerLink="/talento" (click)="cerrarMenu()" class="mobile-menu-link">Talento</a>
      <a routerLink="/" fragment="contacto" (click)="cerrarMenu()" class="mobile-menu-link">Contacto</a>
    </div>
    
    <div class="mobile-menu-footer">
      <span class="mobile-menu-lang font-bold">ES / EN</span>
      <span class="mobile-menu-copyright">© 2026 IMPACTEX</span>
    </div>
  </div>
</div>
